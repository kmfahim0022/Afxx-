<!DOCTYPE html>
<html>

<head>

<title>Afxx Tech Dashboard</title>

<link rel="stylesheet" href="css/dashboard.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="js/dashboard.js"></script>

</head>

<body>

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h2 id="totalUsers">0</h2>
<p>Total Users</p>
</div>

<div class="card">
<h2 id="premiumUsers">0</h2>
<p>Premium Users</p>
</div>

<div class="card">
<h2 id="totalDownloads">0</h2>
<p>Downloads</p>
</div>

<div class="card">
<h2 id="revenue">0 TK</h2>
<p>Revenue</p>
</div>

</div>

<canvas id="analyticsChart"></canvas>

<h2>Recent Users</h2>
<table id="usersTable">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Premium</th>
</tr>
</thead>

<tbody id="usersBody">

</tbody>
</table>

<h2>Recent Payments</h2>

<table id="paymentsTable">

<thead>

<tr>
<th>User</th>
<th>Amount</th>
<th>Status</th>
</tr>

</thead>

<tbody id="paymentsBody">

</tbody>

</table>

<canvas id="lineChart"></canvas>

</body>

</html>
